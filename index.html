<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hexfall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Pixelify+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" width="800" height="600" aria-label="Hexfall - gra"></canvas>

  <div id="account" class="account" hidden>
    <form class="account-panel" novalidate aria-labelledby="account-title">
      <h2 id="account-title">Konto maga</h2>
      <p class="account-hint">Zaloguj się, by grać dalej na każdym komputerze.<br>Zakładając konto, zachowasz obecną grę i wyniki.</p>
      <label>Nick
        <input name="nick" autocomplete="username" spellcheck="false" autocapitalize="off" required>
      </label>
      <label>Hasło
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="account-error" role="alert"></p>
      <div class="account-buttons">
        <button type="submit" value="login">Zaloguj</button>
        <button type="submit" value="register" class="secondary">Załóż konto</button>
      </div>
      <button type="button" class="account-cancel">Esc – wróć do menu</button>
    </form>
  </div>

  <!-- Bez internetu biblioteka się nie wczyta - gra działa wtedy lokalnie (tryb offline). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
          crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/account.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
